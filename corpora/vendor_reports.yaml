# Vendor threat reports: the VENDOR-tier corpus.
#
# The manifest is committed; the PDFs are not. That is a licensing decision as
# much as a size one -- these are copyrighted vendor publications, and
# redistributing them from a public repository is a problem this project does
# not need. A manifest plus a fetcher reproduces the corpus exactly without
# republishing anyone's report.
#
# Why these ten. They are picked for ATT&CK technique density rather than brand
# recognition, because the point of the vendor corpus is to sit *beside* MITRE's
# authoritative text on the same techniques. Red Canary's report is structured
# by ATT&CK technique and is the closest thing to a perfect fit; Sophos and
# Talos carry named tooling and TTPs from incident data; Mandiant, CrowdStrike
# and Unit 42 name the same APT groups the ATT&CK gold set already covers, which
# is what creates genuine retrieval competition. Dragos is the deliberate
# outlier: ICS/OT is a domain ATT&CK Enterprise does not cover, so it tests
# whether the system declines to answer or confabulates. Verizon's DBIR was
# considered and left out -- aggregate statistics, very low named-technique
# density, and large.
#
# `via` records provenance honestly. `publisher` means the URL is hosted by the
# organisation that wrote the report. `mirror` means it is a third-party copy,
# used only where the publisher gates the PDF behind a form. sha256 is recorded
# on first fetch and verified on every one after, so URL rot or a swapped
# document fails loudly instead of being ingested as though nothing changed.
#
# All ten resolve to a direct, ungated PDF; every URL was checked before being
# committed here.

reports:
  - id: RC-TDR-2026
    title: Threat Detection Report 2026
    publisher: Red Canary
    published: "2026-03"
    # Organised by ATT&CK technique. The single best fit in this list.
    # info.zscaler.com is correct: Zscaler acquired Red Canary.
    url: https://info.zscaler.com/rs/306-ZEJ-256/images/2026-ThreatDetectionReport_Guide_RedCanary.pdf
    via: publisher
    filename: redcanary-threat-detection-report-2026.pdf
    sha256: e2c35e2e3f0b8e4b68e73dad4c28ff8c8684ace878fe6d228d7068800e604a25

