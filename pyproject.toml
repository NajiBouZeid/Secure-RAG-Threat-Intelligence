[project]
name = "threatrag"
version = "0.1.0"
description = "Secure Threat Intelligence RAG: build, red-team, defend, and benchmark a security RAG system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Naji Bou Zeid", email = "naji.elia.bouzeid@gmail.com" }]

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "qdrant-client>=1.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "tenacity>=8.3",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11", "pypdf>=4.2"]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
threatrag = "threatrag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/threatrag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
