# Ollama deliberately runs on the HOST, not here: GPU passthrough to a
# containerised Ollama on Windows is unreliable and buys nothing. The app
# reaches it via host.docker.internal.
services:
  qdrant:
    # Kept in step with the qdrant-client pin in pyproject.toml: the client
    # refuses a major mismatch and warns beyond one minor.
    image: qdrant/qdrant:v1.19.0
    container_name: threatrag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: threatrag-api
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      THREATRAG_QDRANT_URL: http://qdrant:6333
      THREATRAG_OLLAMA_URL: http://host.docker.internal:11434
      THREATRAG_DATA_DIR: /app/data
      HF_HOME: /app/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
      - ./attacks:/app/attacks
      - hf_cache:/app/.cache/huggingface
    command: uvicorn threatrag.api.main:app --host 0.0.0.0 --port 8000

volumes:
  qdrant_storage:
  hf_cache:
