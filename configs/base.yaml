# Single source of truth for a run. Experiment configs under configs/experiments/
# deep-merge over this file, so a benchmark cell only states what it changes.

paths:
  data_dir: data
  reports_dir: reports

embedding:
  # MiniLM is the workhorse. GTR is indexed alongside it under a second named
  # vector because it is the only strong model with a public vec2text corrector,
  # which is what makes the Phase 2 inversion attack honest rather than hand-waved.
  primary: all-minilm
  models:
    all-minilm:
      backend: sentence_transformers
      model_id: sentence-transformers/all-MiniLM-L6-v2
      dim: 384
      normalize: true
    gtr-base:
      # Deliberately NOT the sentence_transformers pipeline. The only public
      # vec2text corrector was trained against raw encoder hidden states,
      # masked-mean pooled and left unnormalised; sentence-transformers adds a
      # 768->768 Dense projection and L2 normalisation on top, which yields a
      # different vector of the same width. Inverting the wrong one returns
      # fluent nonsense that reads exactly like a model resisting inversion.
      backend: mean_pooled_encoder
      model_id: sentence-transformers/gtr-t5-base
      dim: 768
      normalize: false
      max_tokens: null        # model maximum; the 32-token control is a CLI flag

chunking:
  # recursive, on evidence: it beat structural on every metric at k=5 and k=10
  # against the M1 gold set (recall@5 +17.9% relative). See reports/m1_baseline.md.
  strategy: recursive        # structural | recursive | fixed
  chunk_size: 512
  chunk_overlap: 64

vector_store:
  backend: qdrant
  url: http://localhost:6333
  collection: threatrag

retrieval:
  top_k: 5
  score_threshold: null

generation:
  backend: ollama
  url: http://localhost:11434
  model: qwen2.5:7b
  temperature: 0.0
  num_ctx: 8192
  max_context_chars: 12000

principals:
  # Demo identities for the API and UI. A lab affordance, not authentication:
  # the caller names one and the server believes it. The threat model here is
  # what retrieval returns for a given clearance, not how identity is proven.
  analyst:
    label: "Analyst (TLP:CLEAR)"
    role: analyst
    clearance: clear
  senior_analyst:
    label: "Senior analyst (TLP:AMBER)"
    role: senior_analyst
    clearance: amber
  ir_lead:
    label: "IR lead (TLP:RED)"
    role: ir_lead
    clearance: red

sources:
  attack_cti:
    enabled: true
    # mitre-attack/attack-stix-data is MITRE's canonical distribution; the older
    # mitre/cti mirror lags it and carries a smaller bundle.
    url: https://raw.githubusercontent.com/mitre-attack/attack-stix-data/master/enterprise-attack/enterprise-attack.json
    include_revoked: false
    include_deprecated: false
  internal_notes:
    # Authored, not fetched: the only corpus in the repo rather than in data/.
    # Enabled by default because without it every indexed document is TLP:CLEAR
    # and the access-control path is untestable end to end.
    enabled: true
    path: corpora/internal_notes.yaml
  nvd_cve:
    enabled: true
    # Two passes: every CVE ATT&CK discusses, then a bounded recent slice.
    include_attack_linked: true
    # Fixed, never now(). A window anchored to the current date would change
    # the corpus between runs and quietly break comparability with M1 and M2.
    # Raising recent_limit later re-fetches only the delta; record the new cap
    # and re-run eval-retrieval alongside it.
    window_end: "2026-09-01"
    window_months: 18
    severities: [CRITICAL, HIGH]
    recent_limit: 5000
  vendor_report:
    # Manifest committed, PDFs gitignored: they are copyrighted publications,
    # so the repo reproduces the corpus without redistributing it.
    enabled: true
    manifest: corpora/vendor_reports.yaml

# Names of enabled defences; empty is the undefended M4/M5 baseline. Membership
# only -- tuning lives in defense_settings, so a benchmark cell can toggle a
# mitigation without restating its parameters. Order here is ignored: the
# registry fixes the order defences run in, so {a, b} and {b, a} are one cell.
#
#   injection_screen    reject documents that instruct the reader (ingest)
#   source_cap          limit how many passages one document may contribute
#   provenance_fence    frame low-trust passages as quoted data, not prose
#   egress_filter       strip outbound URLs from the answer
#   corpus_segregation  write classified chunks to a separate collection
defenses: []

defense_settings:
  source_cap:
    max_per_document: 2
  provenance_fence:
    # Fences VENDOR and below. Fencing only UNTRUSTED would frame nothing but
    # the attack corpus and make the defence free by construction.
    min_tier: 1
  egress_filter:
    # Empty severs every outbound link, including the citation URLs an analyst
    # uses to check a claim by hand. That cost is the point of the dial.
    allowed_hosts: []
  injection_screen:
    extra_patterns: []
